spring.application.name=cityvibe-backend
server.port=${PORT:8080}
server.address=0.0.0.0

# ---- MySQL / JPA ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cityvibe?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:cityvibe}
spring.datasource.password=${DB_PASSWORD:cityvibe123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
